# ─── Eclipse Mosquitto Configuration ─────────────────────────────────────────
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html

# ── MQTT Listener ─────────────────────────────────────────────────────────────
# Standard MQTT port — accepts connections from all network interfaces.
listener 1883 0.0.0.0

# ── WebSocket Listener ────────────────────────────────────────────────────────
# Allows browser-based MQTT clients (e.g. Node-RED dashboard) to connect.
listener 9001 0.0.0.0
protocol websockets

# ── Authentication ────────────────────────────────────────────────────────────
# Anonymous connections are allowed for initial testing and pairing of devices.
# In production, set allow_anonymous to false and configure a password file:
#   password_file /mosquitto/config/passwd
allow_anonymous false

# ── Persistence ───────────────────────────────────────────────────────────────
# Retained messages and subscriptions survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
# Log to both a file (mounted on the host) and stdout (visible via docker logs).
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
