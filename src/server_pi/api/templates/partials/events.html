<div
  hx-get="/ui/partials/events?limit={{ limit }}"
  hx-trigger="every 15s"
  hx-target="this"
  hx-swap="outerHTML"
  class="bg-gray-900 rounded-xl border border-gray-800 p-4">
  <h2 class="font-semibold mb-3">📋 Eventos recientes</h2>

  {% if events %}
  <div class="space-y-1 max-h-80 overflow-y-auto pr-1">
    {% for e in events %}
    <div class="flex items-start gap-2 text-xs py-1.5 border-b border-gray-800 last:border-0">
      <span class="shrink-0 mt-0.5 px-1.5 py-0.5 rounded font-mono uppercase font-bold
        {% if e.level == 'error' %}bg-red-950 text-red-400
        {% elif e.type.value == 'irrigation' %}bg-green-950 text-green-400
        {% elif e.type.value == 'alert' %}bg-yellow-950 text-yellow-400
        {% elif e.type.value == 'actuator' %}bg-blue-950 text-blue-400
        {% else %}bg-gray-800 text-gray-400{% endif %}">
        {{ e.type.value }}
      </span>
      <div class="flex-1 min-w-0">
        <p class="text-gray-200 truncate">{{ e.message }}</p>
        <p class="text-gray-500 truncate">{{ e.device_id }} · {{ e.actor }}</p>
      </div>
      <span class="shrink-0 text-gray-600 font-mono tabular-nums">{{ e.ts.strftime('%H:%M:%S') }}</span>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p class="text-gray-500 text-sm">Sin eventos registrados.</p>
  {% endif %}
</div>
