<div
  id="actuator-card"
  hx-get="/ui/partials/actuator?actuator_id={{ actuator_id }}&zone={{ zone }}"
  hx-trigger="every 10s"
  hx-target="this"
  hx-swap="outerHTML"
  aria-live="polite"
  class="sp-card p-5"
  x-data="{
    endsAt: {% if state.state.value == 'on' %}{{ (state.updated_at.timestamp() + state.safety_timeout_sec) | int }}{% else %}null{% endif %},
    remainingLabel: '',
    timer: null,
    tick() {
      if (!this.endsAt) {
        this.remainingLabel = '';
        return;
      }
      const delta = Math.max(0, (this.endsAt * 1000) - Date.now());
      const minutes = Math.floor(delta / 60000);
      const seconds = Math.floor((delta % 60000) / 1000);
      this.remainingLabel = `${minutes}m ${String(seconds).padStart(2, '0')}s remaining`;
    },
    init() {
      this.tick();
      if (this.endsAt) {
        this.timer = window.setInterval(() => this.tick(), 1000);
      }
    }
  }"
  x-init="init()">
  <div class="mb-5 flex items-start justify-between gap-4">
    <div>
      <p class="sp-section-title mb-2">Actuator</p>
      <h2 class="sp-mono text-sm text-[var(--sp-t1)]">{{ actuator_id }}</h2>
    </div>
    <span class="inline-flex items-center rounded-full border border-[var(--sp-border)] bg-[rgba(255,255,255,0.02)] px-3 py-1 text-xs font-medium uppercase tracking-[0.08em] text-[var(--sp-t2)]">
      {{ state.mode.value }}
    </span>
  </div>

  <div class="mb-5">
    <div class="text-[48px] font-bold leading-none tracking-[-0.04em]" style="color: {% if state.state.value == 'on' %}var(--sp-ok){% else %}var(--sp-err){% endif %};">
      {{ state.state.value | upper }}
    </div>
    {% if state.state.value == 'on' %}
    <div class="mt-3 flex items-center gap-2 text-sm text-[var(--sp-t2)]">
      <span class="inline-flex h-2.5 w-2.5 animate-pulse rounded-full bg-[var(--sp-ok)]"></span>
      <span>Active · <span x-text="remainingLabel"></span></span>
    </div>
    {% endif %}
  </div>

  <dl class="mb-5 grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">
    <div>
      <dt class="sp-metric-lbl">Last change</dt>
      <dd class="mt-1 sp-mono text-[var(--sp-t1)]">{{ state.updated_at.strftime('%Y-%m-%d %H:%M:%S') }} UTC</dd>
    </div>
    <div>
      <dt class="sp-metric-lbl">Last actor</dt>
      <dd class="mt-1 text-[var(--sp-t1)]">{{ state.last_actor }}</dd>
    </div>
  </dl>

  <div class="space-y-4">
    <div class="block">
      <label for="dur-{{ actuator_id }}" class="sr-only">Duration</label>
      <span class="sp-metric-lbl">Duration</span>
      <select id="dur-{{ actuator_id }}" name="duration_sec"
        class="mt-2 w-full rounded-[10px] border border-[var(--sp-border)] bg-[var(--sp-overlay)] px-3 py-2 text-sm text-[var(--sp-t1)] focus:border-[var(--sp-border-hi)] focus:outline-none">
        <option value="30">30 s</option>
        <option value="60">1 min</option>
        <option value="120">2 min</option>
        <option value="300">5 min</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button
        hx-post="/ui/actuators/{{ actuator_id }}/on?zone={{ zone }}"
        hx-include="#dur-{{ actuator_id }}"
        hx-target="#actuator-card"
        hx-swap="outerHTML"
        hx-confirm="Start manual irrigation for the selected duration?"
        aria-label="Activate irrigation for {{ actuator_id }}"
        class="{% if state.state.value == 'off' %}sp-btn-accent{% else %}sp-btn{% endif %} w-full py-2 disabled:cursor-not-allowed disabled:opacity-40"
        {% if state.state.value == 'on' %}disabled{% endif %}>
        Start
      </button>
      <button
        hx-post="/ui/actuators/{{ actuator_id }}/off?zone={{ zone }}"
        hx-target="#actuator-card"
        hx-swap="outerHTML"
        aria-label="Stop irrigation for {{ actuator_id }}"
        class="sp-btn w-full py-2 disabled:cursor-not-allowed disabled:opacity-40"
        style="border-color: {% if state.state.value == 'on' %}color-mix(in srgb, var(--sp-err) 40%, var(--sp-border)){% else %}var(--sp-border){% endif %}; color: {% if state.state.value == 'on' %}var(--sp-err){% else %}var(--sp-t2){% endif %};"
        {% if state.state.value == 'off' %}disabled{% endif %}>
        Stop
      </button>
    </div>
  </div>
</div>
