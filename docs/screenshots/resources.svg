<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif; }
      .mono { font-family: "SF Mono", "Fira Code", ui-monospace, monospace; }
    </style>
    <linearGradient id="brandGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <!-- CPU gauge -->
    <linearGradient id="cpuGaugeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d058"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="#070709"/>

  <!-- Nav -->
  <rect width="1200" height="52" fill="rgba(7,7,9,0.92)"/>
  <rect y="51" width="1200" height="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="24" y="14" width="24" height="24" rx="7" fill="url(#brandGrad6)"/>
  <text x="36" y="30" font-size="11" font-weight="700" fill="#031117" text-anchor="middle">SP</text>
  <text x="56" y="31" font-size="15" font-weight="500" fill="#f5f5f7">Server Pi</text>
  <text x="140" y="31" font-size="14" fill="#98989d">Home</text>
  <text x="200" y="31" font-size="14" fill="#98989d">Dashboard</text>
  <text x="298" y="31" font-size="14" fill="#f5f5f7" font-weight="500">Resources</text>
  <rect x="294" y="51" width="72" height="1" fill="#00c2ff"/>
  <rect x="1030" y="13" width="94" height="26" rx="13" fill="rgba(19,19,26,0.72)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="1047" cy="26" r="3" fill="#34d058"/>
  <text x="1056" y="30" font-size="12" font-weight="500" fill="#f5f5f7">Healthy</text>
  <text x="1136" y="30" font-size="11" fill="#98989d" class="mono">10:36:42 UTC</text>

  <!-- Page header -->
  <text x="16" y="88" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">SYSTEM HEALTH</text>
  <text x="16" y="116" font-size="32" font-weight="700" fill="#f5f5f7" letter-spacing="-1.5">Resources</text>
  <text x="16" y="138" font-size="14" fill="#98989d">Live system resource monitoring for the Raspberry Pi host.</text>

  <!-- Live badge -->
  <rect x="940" y="90" width="110" height="28" rx="14" fill="rgba(19,19,26,0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="960" cy="104" r="4" fill="#34d058"/>
  <text x="970" y="108" font-size="12" fill="#f5f5f7">Live · 5s</text>

  <!-- ── ROW 1: 4 metric cards ── -->

  <!-- CPU card -->
  <rect x="16" y="152" width="280" height="160" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="36" y="176" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">CPU</text>
  <!-- Gauge circle -->
  <circle cx="80" cy="245" r="44" fill="none" stroke="#1a1a24" stroke-width="10"/>
  <circle cx="80" cy="245" r="44" fill="none" stroke="#f5a623" stroke-width="10"
    stroke-dasharray="83 194" stroke-dashoffset="0" stroke-linecap="round"
    transform="rotate(-90 80 245)"/>
  <text x="80" y="242" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle">23%</text>
  <text x="80" y="258" font-size="10" fill="#6e6e73" text-anchor="middle">CPU</text>
  <text x="156" y="196" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">CORES</text>
  <text x="156" y="215" font-size="22" font-weight="700" fill="#f5f5f7">4</text>
  <text x="156" y="235" font-size="11" fill="#98989d">Raspberry Pi 5</text>
  <text x="156" y="254" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">UPTIME</text>
  <text x="156" y="272" font-size="14" font-weight="600" fill="#f5f5f7">3d 14h 22m</text>
  <text x="36" y="300" font-size="10" fill="#6e6e73" class="mono">10:36:42 UTC · refreshed 0s ago</text>

  <!-- Memory card -->
  <rect x="312" y="152" width="280" height="160" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="332" y="176" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">MEMORY</text>
  <circle cx="376" cy="245" r="44" fill="none" stroke="#1a1a24" stroke-width="10"/>
  <circle cx="376" cy="245" r="44" fill="none" stroke="#00c2ff" stroke-width="10"
    stroke-dasharray="125 152" stroke-dashoffset="0" stroke-linecap="round"
    transform="rotate(-90 376 245)"/>
  <text x="376" y="242" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle">45%</text>
  <text x="376" y="258" font-size="10" fill="#6e6e73" text-anchor="middle">MEM</text>
  <text x="452" y="196" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">USED</text>
  <text x="452" y="215" font-size="22" font-weight="700" fill="#f5f5f7">3.6 GB</text>
  <text x="452" y="235" font-size="11" fill="#98989d">of 8.0 GB total</text>
  <text x="452" y="254" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">FREE</text>
  <text x="452" y="272" font-size="14" font-weight="600" fill="#f5f5f7">4.4 GB</text>
  <text x="332" y="300" font-size="10" fill="#6e6e73" class="mono">10:36:42 UTC · 45.0% pressure</text>

  <!-- Disk card -->
  <rect x="608" y="152" width="280" height="160" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="628" y="176" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">DISK</text>
  <circle cx="672" cy="245" r="44" fill="none" stroke="#1a1a24" stroke-width="10"/>
  <circle cx="672" cy="245" r="44" fill="none" stroke="#f5a623" stroke-width="10"
    stroke-dasharray="167 110" stroke-dashoffset="0" stroke-linecap="round"
    transform="rotate(-90 672 245)"/>
  <text x="672" y="242" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle">62%</text>
  <text x="672" y="258" font-size="10" fill="#6e6e73" text-anchor="middle">DISK</text>
  <text x="748" y="196" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">USED</text>
  <text x="748" y="215" font-size="22" font-weight="700" fill="#f5f5f7">123 GB</text>
  <text x="748" y="235" font-size="11" fill="#98989d">of 200 GB total</text>
  <text x="748" y="254" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">FREE</text>
  <text x="748" y="272" font-size="14" font-weight="600" fill="#f5f5f7">77 GB</text>
  <text x="628" y="300" font-size="10" fill="#6e6e73" class="mono">/  •  /boot  •  /data</text>

  <!-- Network card -->
  <rect x="904" y="152" width="280" height="160" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="924" y="176" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">NETWORK</text>
  <text x="924" y="212" font-size="28" font-weight="700" fill="#f5f5f7">↑ 2.4 MB</text>
  <text x="924" y="232" font-size="11" fill="#6e6e73">bytes sent</text>
  <text x="924" y="262" font-size="28" font-weight="700" fill="#00c2ff">↓ 18.7 MB</text>
  <text x="924" y="282" font-size="11" fill="#6e6e73">bytes received</text>
  <text x="924" y="300" font-size="10" fill="#6e6e73" class="mono">eth0  •  cumulative</text>

  <!-- ── ROW 2: CPU history chart + Process table ── -->

  <!-- CPU history chart -->
  <rect x="16" y="328" width="750" height="240" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="36" y="352" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">CPU &amp; MEMORY HISTORY</text>
  <text x="36" y="374" font-size="16" font-weight="600" fill="#f5f5f7">Usage over time</text>
  <!-- Legend -->
  <circle cx="680" cy="353" r="4" fill="#f5a623"/>
  <text x="692" y="357" font-size="11" fill="#98989d">CPU</text>
  <circle cx="728" cy="353" r="4" fill="#00c2ff"/>
  <text x="740" y="357" font-size="11" fill="#98989d">MEM</text>

  <!-- Chart area -->
  <rect x="28" y="388" width="726" height="164" rx="12" fill="rgba(255,255,255,0)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Y axis -->
  <text x="22" y="403" font-size="10" fill="#6e6e73" text-anchor="end" class="mono">100</text>
  <text x="22" y="456" font-size="10" fill="#6e6e73" text-anchor="end" class="mono">50</text>
  <text x="22" y="505" font-size="10" fill="#6e6e73" text-anchor="end" class="mono">0</text>
  <text x="22" y="553" font-size="10" fill="#6e6e73" text-anchor="end" class="mono"></text>

  <line x1="28" y1="400" x2="754" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="28" y1="453" x2="754" y2="453" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="28" y1="506" x2="754" y2="506" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- X labels -->
  <text x="80" y="563" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">10:06</text>
  <text x="240" y="563" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">10:16</text>
  <text x="400" y="563" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">10:26</text>
  <text x="560" y="563" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">10:36</text>
  <text x="720" y="563" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">10:46</text>

  <!-- CPU line (orange, ~23% spiky) -->
  <path d="M80,479 C120,472 150,465 190,470 C230,475 260,455 300,462 C340,469 370,450 410,458 C450,466 480,452 520,460 C560,468 590,448 630,455 C670,462 700,450 720,452"
    fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Memory line (cyan, ~45% flat) -->
  <path d="M80,453 C150,452 220,450 300,451 C380,452 450,448 520,449 C590,450 660,447 720,448"
    fill="none" stroke="#00c2ff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Process table -->
  <rect x="782" y="328" width="402" height="240" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="802" y="352" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">TOP PROCESSES</text>
  <text x="802" y="374" font-size="16" font-weight="600" fill="#f5f5f7">CPU usage</text>

  <!-- Table header -->
  <line x1="802" y1="388" x2="1164" y2="388" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="802" y="403" font-size="10" fill="#6e6e73" font-weight="600" letter-spacing="1">PROCESS</text>
  <text x="1020" y="403" font-size="10" fill="#6e6e73" font-weight="600" letter-spacing="1">CPU%</text>
  <text x="1090" y="403" font-size="10" fill="#6e6e73" font-weight="600" letter-spacing="1">MEM MB</text>
  <text x="1155" y="403" font-size="10" fill="#6e6e73" font-weight="600" letter-spacing="1" text-anchor="end">ST</text>

  <!-- Process rows -->
  <line x1="802" y1="412" x2="1164" y2="412" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="802" y="428" font-size="12" fill="#f5f5f7" class="mono">python3</text>
  <text x="802" y="442" font-size="10" fill="#6e6e73">server-pi-api  PID 1842</text>
  <text x="1025" y="432" font-size="13" fill="#f5a623" class="mono">5.2</text>
  <text x="1095" y="432" font-size="13" fill="#98989d" class="mono">182.4</text>
  <circle cx="1153" cy="432" r="3" fill="#34d058"/>

  <line x1="802" y1="452" x2="1164" y2="452" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="802" y="468" font-size="12" fill="#f5f5f7" class="mono">dockerd</text>
  <text x="802" y="482" font-size="10" fill="#6e6e73">Docker daemon  PID 412</text>
  <text x="1025" y="472" font-size="13" fill="#98989d" class="mono">2.8</text>
  <text x="1095" y="472" font-size="13" fill="#98989d" class="mono">96.1</text>
  <circle cx="1153" cy="472" r="3" fill="#34d058"/>

  <line x1="802" y1="492" x2="1164" y2="492" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="802" y="508" font-size="12" fill="#f5f5f7" class="mono">influxd</text>
  <text x="802" y="522" font-size="10" fill="#6e6e73">InfluxDB  PID 2204</text>
  <text x="1025" y="512" font-size="13" fill="#98989d" class="mono">1.9</text>
  <text x="1095" y="512" font-size="13" fill="#98989d" class="mono">254.8</text>
  <circle cx="1153" cy="512" r="3" fill="#34d058"/>

  <line x1="802" y1="532" x2="1164" y2="532" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="802" y="548" font-size="12" fill="#f5f5f7" class="mono">mosquitto</text>
  <text x="802" y="562" font-size="10" fill="#6e6e73">MQTT broker  PID 1601</text>
  <text x="1025" y="552" font-size="13" fill="#98989d" class="mono">0.4</text>
  <text x="1095" y="552" font-size="13" fill="#98989d" class="mono">12.3</text>
  <circle cx="1153" cy="552" r="3" fill="#34d058"/>

  <!-- Disk partition bar at bottom -->
  <rect x="16" y="584" width="1168" height="100" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="36" y="608" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">DISK PARTITIONS</text>
  <!-- / partition -->
  <text x="36" y="632" font-size="12" fill="#f5f5f7" class="mono">/</text>
  <text x="80" y="632" font-size="12" fill="#98989d">88 GB / 128 GB</text>
  <rect x="200" y="624" width="350" height="6" rx="3" fill="#1a1a24"/>
  <rect x="200" y="624" width="241" height="6" rx="3" fill="#f5a623"/>
  <text x="562" y="632" font-size="12" fill="#f5a623" class="mono">68%</text>
  <!-- /data partition -->
  <text x="36" y="660" font-size="12" fill="#f5f5f7" class="mono">/data</text>
  <text x="100" y="660" font-size="12" fill="#98989d">35 GB / 72 GB</text>
  <rect x="200" y="652" width="350" height="6" rx="3" fill="#1a1a24"/>
  <rect x="200" y="652" width="170" height="6" rx="3" fill="#34d058"/>
  <text x="562" y="660" font-size="12" fill="#34d058" class="mono">48%</text>
  <!-- /boot partition -->
  <text x="620" y="632" font-size="12" fill="#f5f5f7" class="mono">/boot</text>
  <text x="688" y="632" font-size="12" fill="#98989d">0.3 GB / 0.5 GB</text>
  <rect x="810" y="624" width="200" height="6" rx="3" fill="#1a1a24"/>
  <rect x="810" y="624" width="120" height="6" rx="3" fill="#f5a623"/>
  <text x="1022" y="632" font-size="12" fill="#f5a623" class="mono">60%</text>
</svg>
