  <text x="44" y="246" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">SOIL MOISTURE</text>
  <text x="468" y="246" font-size="13" font-weight="600" fill="#ff5f57" text-anchor="end">28.5%</text>
  <rect x="44" y="252" width="424" height="4" rx="2" fill="#1a1a24"/>
  <rect x="44" y="252" width="121" height="4" rx="2" fill="#ff5f57"/>

