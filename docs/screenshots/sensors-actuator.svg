  <rect x="864" y="13" width="94" height="26" rx="13" fill="rgba(19,19,26,0.72)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="881" cy="26" r="3" fill="#34d058"/>
  <text x="890" y="30" font-size="12" font-weight="500" fill="#f5f5f7">Healthy</text>
  <text x="970" y="30" font-size="11" fill="#98989d" class="mono">10:36 UTC</text>

  <!-- SENSORS CARD (detailed) -->
  <rect x="16" y="68" width="476" height="476" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="36" y="92" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">GREENHOUSE</text>
  <text x="36" y="116" font-size="17" font-weight="600" fill="#f5f5f7">Sensor telemetry</text>
  <text x="452" y="92" font-size="12" fill="#f5f5f7" text-anchor="end" font-weight="500">2 sensors</text>
  <text x="476" y="108" font-size="11" fill="#6e6e73" text-anchor="end" class="mono">10:36:42 UTC</text>

  <!-- Device 1 — BLE sensor (full detail) -->
  <rect x="28" y="128" width="452" height="192" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="44" y="152" font-size="13" fill="#f5f5f7" class="mono">ble-aa-bb-cc-dd</text>
  <rect x="354" y="140" width="36" height="18" rx="4" fill="#1a1a24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="372" y="153" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">ble</text>
  <circle cx="412" cy="149" r="4" fill="#34d058"/>
  <text x="424" y="153" font-size="11" fill="#98989d" class="mono">10:36:35 UTC</text>

  <!-- Temperature -->
  <text x="44" y="182" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">TEMPERATURE</text>
  <text x="468" y="182" font-size="13" font-weight="600" fill="#f5a623" text-anchor="end">24.3 °C</text>
  <rect x="44" y="188" width="424" height="4" rx="2" fill="#1a1a24"/>
  <rect x="44" y="188" width="236" height="4" rx="2" fill="#f5a623"/>

