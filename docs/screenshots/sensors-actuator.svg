  <rect x="20" y="14" width="24" height="24" rx="7" fill="url(#brandGrad3)"/>
  <text x="32" y="30" font-size="11" font-weight="700" fill="#031117" text-anchor="middle">SP</text>
  <text x="52" y="31" font-size="15" font-weight="500" fill="#f5f5f7">Server Pi</text>
  <text x="136" y="31" font-size="14" fill="#98989d">Home</text>
