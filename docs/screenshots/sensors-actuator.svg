  <text x="44" y="214" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">HUMIDITY AMB.</text>
  <text x="468" y="214" font-size="13" font-weight="600" fill="#00c2ff" text-anchor="end">62.1%</text>
  <rect x="44" y="220" width="424" height="4" rx="2" fill="#1a1a24"/>
  <rect x="44" y="220" width="263" height="4" rx="2" fill="#00c2ff"/>

