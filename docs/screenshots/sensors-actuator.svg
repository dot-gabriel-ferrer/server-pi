    </style>
    <linearGradient id="brandGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#070709"/>

  <!-- Nav -->
  <rect width="1000" height="52" fill="rgba(7,7,9,0.92)"/>
