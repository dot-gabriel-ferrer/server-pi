  <text x="44" y="278" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">BATTERY</text>
  <text x="468" y="278" font-size="13" font-weight="600" fill="#98989d" text-anchor="end">87%</text>
  <rect x="44" y="284" width="424" height="4" rx="2" fill="#1a1a24"/>
  <rect x="44" y="284" width="369" height="4" rx="2" fill="#636366"/>

  <text x="44" y="310" font-size="11" fill="#6e6e73" class="mono">Last update: 10:36:35 UTC</text>

  <!-- Device 2 — Zigbee sensor -->
  <rect x="28" y="332" width="452" height="148" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="44" y="356" font-size="13" fill="#f5f5f7" class="mono">zigbee-0x1234abcd</text>
  <rect x="338" y="344" width="52" height="18" rx="4" fill="#1a1a24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="364" y="357" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">zigbee</text>
  <circle cx="412" cy="353" r="4" fill="#34d058"/>
  <text x="424" y="357" font-size="11" fill="#98989d" class="mono">10:36:40 UTC</text>

  <text x="44" y="388" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">TEMPERATURE</text>
  <text x="468" y="388" font-size="13" font-weight="600" fill="#f5a623" text-anchor="end">23.8 °C</text>
  <rect x="44" y="394" width="424" height="4" rx="2" fill="#1a1a24"/>
  <rect x="44" y="394" width="230" height="4" rx="2" fill="#f5a623"/>

  <text x="44" y="420" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">HUMIDITY AMB.</text>
  <text x="468" y="420" font-size="13" font-weight="600" fill="#00c2ff" text-anchor="end">58.7%</text>
  <rect x="44" y="426" width="424" height="4" rx="2" fill="#1a1a24"/>
  <rect x="44" y="426" width="249" height="4" rx="2" fill="#00c2ff"/>

  <text x="44" y="452" font-size="11" fill="#6e6e73" class="mono">Last update: 10:36:40 UTC</text>

  <!-- Stale device indicator -->
  <rect x="28" y="492" width="452" height="44" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="44" y="514" font-size="12" fill="#6e6e73" class="mono">ble-ee-ff-00-11</text>
  <rect x="338" y="500" width="36" height="18" rx="4" fill="#1a1a24"/>
  <text x="356" y="513" font-size="10" fill="#6e6e73" text-anchor="middle" class="mono">ble</text>
  <circle cx="412" cy="509" r="4" fill="#ff5f57"/>
  <text x="424" y="513" font-size="11" fill="#ff5f57" class="mono">09:48:02 UTC</text>
  <text x="44" y="528" font-size="11" fill="#6e6e73">Signal lost — last seen 48m ago</text>

  <!-- ACTUATOR CARD (detailed, ON state) -->
  <rect x="508" y="68" width="476" height="476" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="528" y="92" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="2">ACTUATOR</text>
  <text x="528" y="116" font-size="14" fill="#f5f5f7" class="mono">irrigation-main</text>
  <rect x="872" y="76" width="72" height="22" rx="11" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="908" y="91" font-size="11" fill="#98989d" text-anchor="middle">manual</text>

  <!-- State ON -->
  <text x="528" y="186" font-size="56" font-weight="700" fill="#34d058" letter-spacing="-2">ON</text>

  <!-- Pulse dot + countdown -->
  <circle cx="528" cy="202" r="5" fill="#34d058"/>
  <circle cx="528" cy="202" r="9" fill="none" stroke="#34d058" stroke-width="1" opacity="0.3"/>
  <text x="540" y="206" font-size="13" fill="#98989d">Active · <tspan fill="#34d058" font-weight="600">2m 18s remaining</tspan></text>

  <text x="528" y="240" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">LAST CHANGE</text>
  <text x="528" y="256" font-size="12" fill="#f5f5f7" class="mono">2026-08-03 10:34:55 UTC</text>
  <text x="750" y="240" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">LAST ACTOR</text>
  <text x="750" y="256" font-size="12" fill="#f5f5f7">rules-engine</text>

  <!-- Duration selector -->
  <text x="528" y="284" font-size="10" font-weight="600" fill="#6e6e73" letter-spacing="1">DURATION</text>
  <rect x="528" y="292" width="452" height="32" rx="8" fill="#1a1a24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="548" y="313" font-size="13" fill="#f5f5f7">2 min  ▾</text>

  <!-- Buttons — active state shows Stop as red -->
  <rect x="528" y="336" width="218" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="637" y="360" font-size="13" fill="#98989d" text-anchor="middle" opacity="0.5">Start</text>
  <rect x="762" y="336" width="218" height="36" rx="8" fill="rgba(255,95,87,0.08)" stroke="rgba(255,95,87,0.3)" stroke-width="1"/>
  <text x="871" y="360" font-size="13" font-weight="600" fill="#ff5f57" text-anchor="middle">Stop</text>

  <!-- Additional state info -->
  <rect x="528" y="390" width="452" height="76" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="548" y="412" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">SAFETY TIMEOUT</text>
  <text x="548" y="430" font-size="13" fill="#f5f5f7">120 s  (safety watchdog)</text>
  <text x="548" y="458" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">ACTIVATION REASON</text>
  <text x="548" y="456" font-size="13" fill="#f5f5f7" dy="16">soil moisture below 35% threshold</text>

  <!-- State history mini timeline -->
  <text x="528" y="496" font-size="11" font-weight="600" fill="#6e6e73" letter-spacing="1">RECENT ACTIVATIONS</text>
  <line x1="528" y1="502" x2="968" y2="502" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="528" y="516" font-size="11" fill="#98989d" class="mono">10:34:55</text>
  <rect x="590" y="508" width="60" height="10" rx="3" fill="rgba(52,208,88,0.3)"/>
  <text x="540" y="528" font-size="11" fill="#6e6e73" class="mono">10:14:02</text>
  <rect x="602" y="520" width="45" height="10" rx="3" fill="rgba(52,208,88,0.2)"/>
</svg>
