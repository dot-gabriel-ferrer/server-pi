<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#030712"/>

  <!-- Top bar -->
  <rect width="800" height="48" fill="#030712" stroke="#1f2937" stroke-width="1"/>
  <text x="16" y="30" font-size="15" font-weight="700" fill="#f3f4f6">🌱 Server Pi</text>
  <text x="106" y="30" font-size="12" fill="#6b7280">Plataforma IoT local-first</text>
  <rect x="585" y="12" width="110" height="22" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="598" y="27" font-size="10" fill="#d1d5db">greenhouse ▾</text>
  <rect x="702" y="12" width="58" height="22" rx="11" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="714" y="27" font-size="10" font-weight="600" fill="#4ade80">● OK</text>

  <!-- Panel heading -->
  <text x="16" y="78" font-size="14" font-weight="600" fill="#f3f4f6">🌡️ Sensores — greenhouse</text>

  <!-- Sensor device 1 -->
  <rect x="16" y="88" width="380" height="166" rx="10" fill="#1f2937"/>
  <text x="30" y="112" font-size="11" fill="#d1d5db" class="mono">ble-aa-bb-cc-dd</text>
  <rect x="278" y="100" width="36" height="16" rx="3" fill="#374151"/>
  <text x="284" y="112" font-size="10" fill="#9ca3af" class="mono">ble</text>
  <circle cx="330" cy="108" r="4.5" fill="#22c55e"/>

  <!-- temp -->
  <text x="30" y="140" font-size="10" fill="#6b7280">Temperatura</text>
  <text x="296" y="140" font-size="11" font-weight="600" fill="#f97316">24.3 °C</text>
  <rect x="30" y="144" width="358" height="5" rx="2.5" fill="#374151"/>
  <rect x="30" y="144" width="200" height="5" rx="2.5" fill="#f97316"/>

  <!-- humidity -->
  <text x="210" y="140" font-size="10" fill="#6b7280">Humedad amb.</text>
  <text x="296" y="140" font-size="11" font-weight="600" fill="#3b82f6" dx="100">62.1%</text>
  <rect x="210" y="144" width="178" height="5" rx="2.5" fill="#374151"/>
  <rect x="210" y="144" width="111" height="5" rx="2.5" fill="#3b82f6"/>

  <!-- soil moisture -->
  <text x="30" y="176" font-size="10" fill="#6b7280">Humedad suelo</text>
  <text x="296" y="176" font-size="11" font-weight="600" fill="#eab308">28.5%</text>
  <rect x="30" y="180" width="178" height="5" rx="2.5" fill="#374151"/>
  <rect x="30" y="180" width="50" height="5" rx="2.5" fill="#eab308"/>

  <!-- battery -->
  <text x="210" y="176" font-size="10" fill="#6b7280">Batería</text>
  <text x="360" y="176" font-size="11" font-weight="600" fill="#d1d5db">87%</text>
  <rect x="210" y="180" width="178" height="5" rx="2.5" fill="#374151"/>
  <rect x="210" y="180" width="155" height="5" rx="2.5" fill="#9ca3af"/>

  <text x="30" y="244" font-size="10" fill="#4b5563" class="mono">10:35:42 UTC</text>

  <!-- Sensor device 2 -->
  <rect x="16" y="262" width="380" height="136" rx="10" fill="#1f2937"/>
  <text x="30" y="285" font-size="11" fill="#d1d5db" class="mono">zigbee-0x1234</text>
  <rect x="272" y="273" width="46" height="16" rx="3" fill="#374151"/>
  <text x="278" y="285" font-size="10" fill="#9ca3af" class="mono">zigbee</text>
  <circle cx="330" cy="281" r="4.5" fill="#22c55e"/>

  <text x="30" y="312" font-size="10" fill="#6b7280">Temperatura</text>
  <text x="296" y="312" font-size="11" font-weight="600" fill="#f97316">23.8 °C</text>
  <rect x="30" y="316" width="358" height="5" rx="2.5" fill="#374151"/>
  <rect x="30" y="316" width="195" height="5" rx="2.5" fill="#f97316"/>

  <text x="210" y="312" font-size="10" fill="#6b7280">Humedad amb.</text>
  <text x="296" y="312" font-size="11" font-weight="600" fill="#3b82f6" dx="100">58.7%</text>
  <rect x="210" y="316" width="178" height="5" rx="2.5" fill="#374151"/>
  <rect x="210" y="316" width="104" height="5" rx="2.5" fill="#3b82f6"/>

  <text x="30" y="376" font-size="10" fill="#4b5563" class="mono">10:35:50 UTC</text>
  <text x="280" y="412" font-size="10" fill="#4b5563">Actualizado: 10:36:02 UTC</text>

  <!-- === Right panel: Actuador === -->
  <rect x="412" y="60" width="372" height="200" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="428" y="86" font-size="14" font-weight="600" fill="#f3f4f6">💧 Actuador — irrigation-main</text>

  <text x="428" y="132" font-size="34" font-weight="800" fill="#f87171">OFF</text>
  <rect x="518" y="110" width="72" height="22" rx="11" fill="#374151"/>
  <text x="530" y="124" font-size="11" fill="#9ca3af">manual</text>

  <text x="428" y="162" font-size="11" fill="#6b7280">Último cambio</text>
  <text x="566" y="162" font-size="10" fill="#d1d5db" class="mono">2026-08-03 10:35:12 UTC</text>
  <text x="428" y="182" font-size="11" fill="#6b7280">Actor</text>
  <text x="566" y="182" font-size="11" fill="#d1d5db">portal-ui</text>

  <text x="428" y="208" font-size="10" fill="#6b7280">Duración</text>
  <rect x="428" y="215" width="80" height="26" rx="4" fill="#1f2937" stroke="#374151"/>
  <text x="440" y="231" font-size="11" fill="#d1d5db">30 s ▾</text>
  <rect x="522" y="213" width="110" height="28" rx="6" fill="#2563eb"/>
  <text x="546" y="231" font-size="12" font-weight="600" fill="white">▶ Riego</text>
  <rect x="646" y="213" width="100" height="28" rx="6" fill="#b91c1c" opacity="0.5"/>
  <text x="668" y="231" font-size="12" font-weight="600" fill="#fca5a5">■ Parar</text>

  <!-- Rule panel -->
  <rect x="412" y="276" width="372" height="200" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="428" y="302" font-size="14" font-weight="600" fill="#f3f4f6">⚙️ Regla de riego</text>
  <rect x="724" y="285" width="48" height="20" rx="10" fill="#052e16" stroke="#166534"/>
  <text x="731" y="298" font-size="9" font-weight="700" fill="#4ade80">ACTIVA</text>

  <text x="428" y="332" font-size="10" fill="#6b7280">Umbral suelo</text>
  <text x="428" y="348" font-size="13" font-weight="600" fill="#4ade80">35%</text>
  <rect x="428" y="352" width="110" height="4" rx="2" fill="#374151"/>
  <rect x="428" y="352" width="39" height="4" rx="2" fill="#16a34a"/>

  <text x="580" y="332" font-size="10" fill="#6b7280">Ventana UTC</text>
  <text x="580" y="348" font-size="12" fill="#e5e7eb">05:00 – 11:00</text>

  <text x="428" y="380" font-size="10" fill="#6b7280">Cooldown</text>
  <text x="428" y="396" font-size="12" fill="#e5e7eb">180 min</text>

  <text x="580" y="380" font-size="10" fill="#6b7280">Duración máx.</text>
  <text x="580" y="396" font-size="12" fill="#e5e7eb">60 s</text>

  <text x="428" y="450" font-size="11" fill="#60a5fa">✏️ Editar regla ▸</text>
</svg>
